<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <title>AI Studieassistent</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; }
    textarea { width: 100%; height: 150px; margin-bottom: 10px; }
    button { background: #0066cc; color: white; padding: 10px 20px; border: none; cursor: pointer; }
    .card { background: #f4f4f9; padding: 15px; margin-top: 15px; border-radius: 5px; }
    .option { display: block; margin: 5px 0; }
  </style>
</head>
<body>

  <h1>📖 AI Studieassistent & Quiz Generator</h1>
  <textarea id="inputText" placeholder="Klistra in din studietext här..."></textarea><br>
  <button onclick="generateQuiz()" id="btn">Skapa Sammanfattning & Quiz</button>

  <div id="output"></div>

  <script>
    const API_URL = "https://n5znous5ue.execute-api.eu-north-1.amazonaws.com/generate";

    async function generateQuiz() {
      const text = document.getElementById("inputText").value;
      const output = document.getElementById("output");
      const btn = document.getElementById("btn");

      if (!text) return alert("Klistra in lite text först!");

      btn.disabled = true;
      output.innerHTML = "<p><em>Genererar sammanfattning och quiz...</em></p>";

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text })
        });

        const data = await res.json();
        btn.disabled = false;

        // Bygg UI baserat på JSON-svaret
        let html = `<div class="card"><h3>📝 Sammanfattning</h3><p>${data.summary}</p></div>`;
        html += "<h3>❓ Quiz</h3>";

        data.quiz.forEach((q, idx) => {
          html += `<div class="card"><p><strong>${idx + 1}. ${q.question}</strong></p>`;
          q.options.forEach(opt => {
            html += `<label class="option"><input type="radio" name="q${idx}" value="${opt}"> ${opt}</label>`;
          });
          html += `</div>`;
        });

        output.innerHTML = html;

      } catch (err) {
        btn.disabled = false;
        output.innerHTML = "<p style='color:red;'>Något gick fel. Kontrollera din API-länk.</p>";
      }
    }
  </script>
</body>
</html>
